name: Deploy VAYNTR Talent to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build production site
        run: npm run build
        env:
          GITHUB_PAGES: 'true'

      - name: Verify export cannot publish the README
        shell: bash
        run: |
          set -euo pipefail
          test -s out/index.html
          if ! grep -q 'Find your place' out/index.html; then
            echo 'Expected the compiled VAYNTR Talent homepage in out/index.html.'
            exit 1
          fi
          readme_file="$(find out -type f \( -iname 'README.md' -o -iname 'README.html' \) -print -quit)"
          if [ -n "$readme_file" ]; then
            echo "README files are not allowed in the published artifact: $readme_file"
            exit 1
          fi
          touch out/.nojekyll

      - name: Publish verified static export to branch-based Pages root
        shell: bash
        run: |
          set -euo pipefail

          # Keep the compiled app in the branch root as well, so legacy branch-based
          # Pages never falls back to README.md or the setup-only index.html page.
          rm -rf ./_next
          cp -a out/_next ./_next
          git add -A -- _next

          while IFS= read -r -d '' file; do
            target="${file#out/}"
            mkdir -p "$(dirname "$target")"
            cp -f "$file" "$target"
            git add -A -- "$target"
          done < <(find out -type f -print0)

          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -m "Publish compiled VAYNTR Talent site [skip ci]"
            git push origin HEAD:main
          else
            echo "The compiled site is already synced to the branch root."
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload production build
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
